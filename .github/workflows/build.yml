name: Tram checks
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: tram-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-dev.txt
      - name: Tests including packaged schema and version compatibility
        run: python -m pytest -q --junitxml=reports/pytest.xml
      - run: python scripts/build.py --check
      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tram-tests-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/pytest.xml
          if-no-files-found: warn
          retention-days: 14
