<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc">
<title id="title">Tram 시작과 승인 흐름</title><desc id="desc">start가 프로젝트 코드·문서·지식을 조사한 뒤 질문하고, PRD 사람 확정, Plan 사람 승인, 구현·지식 반영과 검증을 이어갑니다. 승인 지점은 두 곳입니다.</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Apple SD Gothic Neo',Arial,sans-serif}.still{display:none}@media(prefers-reduced-motion:reduce){.moving{display:none}.still{display:block}}</style>
<defs><radialGradient id="wash"><stop stop-color="#e4f5f2"/><stop offset="1" stop-color="#f8fafb"/></radialGradient>
<filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="6"/></filter></defs><rect width="1200" height="240" rx="16" fill="#f8fafb"/><path d="M105 102 H1095" stroke="#d5e3e7" stroke-width="2" fill="none"/><circle cx="105" cy="102" r="20" fill="#ffffff" stroke="#138b8b" stroke-width="1.5"/><circle cx="105" cy="102" r="4" fill="#138b8b"/><text x="105" y="146" text-anchor="middle" fill="#17252b" font-size="19" font-weight="650">start</text><text x="105" y="170" text-anchor="middle" fill="#64777f" font-size="12">조사 후 요청·재개</text><circle cx="355" cy="102" r="20" fill="#ffffff" stroke="#cd7547" stroke-width="1.5"/><circle cx="355" cy="102" r="4" fill="#cd7547"/><text x="355" y="146" text-anchor="middle" fill="#17252b" font-size="19" font-weight="650">PRD</text><text x="355" y="170" text-anchor="middle" fill="#64777f" font-size="12">무엇을 만들지 확정</text><rect x="320" y="41" width="70" height="22" rx="11" fill="#ffffff"/><text x="355" y="56" text-anchor="middle" fill="#cd7547" font-size="11" font-weight="600">사람 확정</text><circle cx="605" cy="102" r="20" fill="#ffffff" stroke="#cd7547" stroke-width="1.5"/><circle cx="605" cy="102" r="4" fill="#cd7547"/><text x="605" y="146" text-anchor="middle" fill="#17252b" font-size="19" font-weight="650">Plan</text><text x="605" y="170" text-anchor="middle" fill="#64777f" font-size="12">어떻게 만들지 승인</text><rect x="570" y="41" width="70" height="22" rx="11" fill="#ffffff"/><text x="605" y="56" text-anchor="middle" fill="#cd7547" font-size="11" font-weight="600">사람 승인</text><circle cx="855" cy="102" r="20" fill="#ffffff" stroke="#138b8b" stroke-width="1.5"/><circle cx="855" cy="102" r="4" fill="#138b8b"/><text x="855" y="146" text-anchor="middle" fill="#17252b" font-size="19" font-weight="650">구현</text><text x="855" y="170" text-anchor="middle" fill="#64777f" font-size="12">코드 + 확정 지식 반영</text><circle cx="1095" cy="102" r="20" fill="#ffffff" stroke="#138b8b" stroke-width="1.5"/><circle cx="1095" cy="102" r="4" fill="#138b8b"/><text x="1095" y="146" text-anchor="middle" fill="#17252b" font-size="19" font-weight="650">검증</text><text x="1095" y="170" text-anchor="middle" fill="#64777f" font-size="12">테스트·독립 검토</text><path d="M1095 123 V185 Q1095 207 1073 207 H877 Q855 207 855 185" stroke="#d5e3e7" stroke-width="1.5" fill="none"/>
<path d="M850 190 L855 184 L860 190" fill="none" stroke="#138b8b" stroke-width="1.5"/>
<text x="975" y="228" text-anchor="middle" fill="#64777f" font-size="11">구현결함은 수정 후 재검증 · 설계문제는 승인 단계 재검토</text>
<g class="moving"><circle r="11" fill="#138b8b" opacity=".4" filter="url(#glow)"/><circle r="5" fill="#138b8b"/><animateMotion dur="12s" path="M105 102 H1095" keyPoints="0;.2525;.2525;.505;.505;1" keyTimes="0;.2;.3;.5;.6;1" calcMode="linear" repeatCount="indefinite"/></g>
<circle class="still" cx="855" cy="102" r="5" fill="#138b8b"/>
</svg>